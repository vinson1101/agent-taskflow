name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run atf:standalone:operator:test
      - run: npm run atf:u0:standalone:smoke
      - run: npm run atf:dsh:hardening:test
      - run: npm run atf:dsh:integrated:smoke
      - run: npm run atf:dsh:handoff:smoke
      - run: npm run atf:dsh:public-research:test
      - run: npm run atf:release:packlist
